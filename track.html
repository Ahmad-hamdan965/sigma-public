<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Your Shipment — SIGMA XPRESS</title>
<style>
  :root{ --red:#DC2430; --navy:#0F2A4D; --navy2:#173C6B; --bg:#F5F6F8; --card:#fff;
    --line:#E6E8EC; --text:#16202E; --mut:#6B7686; --ok:#0E7A3D; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg);
    color:var(--text); margin:0; min-height:100vh;}
  .top{background:var(--navy); color:#fff; padding:18px 20px; text-align:center;}
  .top .brand{font-size:20px; font-weight:800; letter-spacing:2px;}
  .top .brand span{color:#fff;} .top .brand b{color:#fff;}
  .brand .x{color:#FF6B73;}
  .wrap{max-width:620px; margin:0 auto; padding:28px 18px 60px;}
  h1{font-size:21px; color:var(--navy); text-align:center; margin:10px 0 4px;}
  .sub{text-align:center; color:var(--mut); font-size:13px; margin-bottom:22px;}
  .searchRow{display:flex; gap:8px; margin-bottom:8px;}
  input{flex:1; padding:14px 16px; border:1.5px solid var(--line); border-radius:12px; font-size:15px;}
  input:focus{outline:none; border-color:var(--navy2);}
  button{background:var(--red); color:#fff; border:none; border-radius:12px; padding:0 22px;
    font-size:15px; font-weight:700; cursor:pointer;}
  button:disabled{opacity:.6; cursor:default;}
  .hint{color:var(--mut); font-size:12px; text-align:center; margin-bottom:20px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:18px;}
  .status{display:inline-block; background:#FDF2E3; color:#B96A00; font-weight:700; font-size:13px;
    padding:5px 14px; border-radius:20px; margin-bottom:6px;}
  .tn{font-size:18px; font-weight:800; color:var(--navy); letter-spacing:1px;}
  .meta{display:flex; flex-wrap:wrap; gap:14px; margin:16px 0; color:var(--text); font-size:13px;}
  .meta div span{color:var(--mut); display:block; font-size:11px; margin-bottom:2px;}
  .timeline{margin-top:14px; border-top:1px solid var(--line); padding-top:14px;}
  .tl-item{display:flex; gap:12px; padding:8px 0;}
  .dot{width:12px; height:12px; border-radius:50%; background:var(--navy); flex:none; margin-top:4px;}
  .tl-item:last-child .dot{background:var(--ok);}
  .tl-label{font-weight:700; font-size:13.5px;}
  .tl-date{color:var(--mut); font-size:11.5px;}
  .err{text-align:center; color:var(--red); font-size:14px; padding:18px;}
  .foot{text-align:center; color:var(--mut); font-size:11.5px; margin-top:30px;}
</style>
</head>
<body>
  <div class="top"><div class="brand">SIGMA <span class="x">XPRESS</span></div></div>
  <div class="wrap">
    <h1>Track Your Shipment</h1>
    <div class="sub">تتبّع شحنتك · Enter your tracking number below</div>

    <div class="searchRow">
      <input id="tn" placeholder="SGX-2026-00001" autocomplete="off" />
      <button id="btn" onclick="track()">Track</button>
    </div>
    <div class="hint">Your tracking number is on the sticker on your package · رقمك موجود على ملصق الطرد</div>

    <div id="result"></div>
  </div>
  <div class="foot">© 2026 SIGMA XPRESS · www.sigmaexprissdxb.com · 00971528477997</div>

<script>
  const API_URL = 'https://sigma-31hr.onrender.com';

  // allow ?track=SGX-... deep links and Enter key
  document.getElementById('tn').addEventListener('keydown', e => { if (e.key === 'Enter') track(); });
  const params = new URLSearchParams(location.search);
  if (params.get('track')) { document.getElementById('tn').value = params.get('track'); track(); }

  async function track(){
    const tn = document.getElementById('tn').value.trim().toUpperCase();
    const result = document.getElementById('result');
    const btn = document.getElementById('btn');
    if (!tn) return;
    btn.disabled = true; btn.textContent = '...';
    result.innerHTML = '';
    try {
      const res = await fetch(`${API_URL}/track/${encodeURIComponent(tn)}`);
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        result.innerHTML = `<div class="card err">${e.error || 'Shipment not found.'}</div>`;
        return;
      }
      const d = await res.json();
      result.innerHTML = `
        <div class="card">
          <div class="status">${d.status}</div>
          <div class="tn">${d.trackingNumber}</div>
          <div class="meta">
            ${d.shipmentCode ? `<div><span>Shipment</span>${d.shipmentCode}</div>` : ''}
            ${d.freightType ? `<div><span>Type</span>${d.freightType}</div>` : ''}
            ${d.origin ? `<div><span>Origin</span>${d.origin}</div>` : ''}
            ${d.destination ? `<div><span>Destination</span>${d.destination}</div>` : ''}
            ${d.weightKg != null ? `<div><span>Weight</span>${d.weightKg} kg</div>` : ''}
            ${d.volumeCbm != null ? `<div><span>Volume</span>${d.volumeCbm} CBM</div>` : ''}
          </div>
          ${d.timeline && d.timeline.length ? `<div class="timeline">
            ${d.timeline.map(t => `<div class="tl-item"><div class="dot"></div>
              <div><div class="tl-label">${t.statusLabel}</div>
              <div class="tl-date">${new Date(t.createdAt).toLocaleString()}</div>
              ${t.note ? `<div class="tl-date">${t.note}</div>` : ''}</div></div>`).join('')}
          </div>` : ''}
        </div>`;
    } catch (err) {
      result.innerHTML = `<div class="card err">Could not connect. Please try again.</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Track';
    }
  }
</script>
</body>
</html>
